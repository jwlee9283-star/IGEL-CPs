<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eee3d4">
<meta name="description" content="이진원과 서희의 결혼식에 초대합니다. 2027년 2월 27일 오후 5시.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Noto+Serif+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<title>Our Ever After – A Journey to Forever</title>
<style>
/* Offline-safe system font stack; no external font request required. */

:root {
  --paper: #f0e4d4;
  --paper-deep: #e8d8c5;
  --ink: #55483c;
  --muted: #8a7866;
  --gold: #ad8d68;
  --gold-soft: #d4b99a;
  --line: rgba(151, 119, 85, .36);
  --serif: 'Cormorant Garamond', 'Noto Serif KR', Georgia, serif;
  --korean: 'Noto Serif KR', 'Batang', serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
body {
  color: var(--ink);
  font-family: var(--korean);
  background:
    radial-gradient(ellipse at 15% 12%, rgba(244,233,217,.58), transparent 38%),
    radial-gradient(ellipse at 84% 86%, rgba(213,191,164,.25), transparent 42%),
    linear-gradient(135deg, #e9dccb 0%, #e2d1bd 50%, #f0e5d7 100%);
}
button, input, select, textarea { font: inherit; }
button { color: inherit; }
.invitation-app {
  width: 100%; height: 100dvh; min-height: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  padding: max(12px, env(safe-area-inset-top)) 14px max(8px, env(safe-area-inset-bottom));
}
.topbar { width: min(100%, 560px); display:flex; justify-content:space-between; align-items:center; color:#927b62; letter-spacing:.19em; font: 500 10px var(--serif); padding: 0 3px; }
.topbar__edition { opacity:.72; font-size:9px; }
.viewer { width:100%; flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; }
.book-stage {
  position:relative;
  width:min(92vw, 460px, calc((100dvh - 174px) * .585));
  aspect-ratio:.585;
  max-height:calc(100dvh - 174px);
  flex:0 1 auto;
  isolation:isolate;
  filter:drop-shadow(0 18px 26px rgba(83,62,43,.17));
}
.book-stage::before {
  content:"";
  position:absolute;
  z-index:-1;
  inset:5px -5px -5px 5px;
  border:1px solid rgba(143,112,80,.22);
  border-radius:4px 12px 12px 4px;
  background:linear-gradient(90deg,#e6d8c7 0%,#f5eadc 8%,#e7d8c6 100%);
  box-shadow:0 8px 18px rgba(83,62,43,.10);
}
.book {
  position:relative;
  width:100%;
  height:100%;
  margin:0 auto;
  touch-action:pan-y;
  -webkit-tap-highlight-color:transparent;
}
.book .page {
  overflow:hidden;
  background:var(--paper);
  border:0;
}
.book .page-content {
  position:relative;
  width:100%;
  height:100%;
  min-width:0;
  min-height:0;
  overflow:hidden;
}
.page-fallback {
  width:100%; height:100%; display:grid; place-content:center; text-align:center;
  color:var(--muted); font-size:13px; line-height:2;
  background:linear-gradient(145deg,#fbf5ed,#f2e5d6);
  border:1px solid rgba(169,137,103,.35);
}

.paper-page {
  position:relative; width:100%; height:100%; overflow:hidden; isolation:isolate;
  padding:clamp(18px,4.2vw,30px) clamp(17px,4.8vw,29px) 37px;
  border:1px solid rgba(169,137,103,.35);
  border-radius:5px 12px 12px 5px;
  background-color:var(--paper);
  background-image:
    radial-gradient(ellipse at 14% 8%, rgba(248,239,226,.62), transparent 34%),
    radial-gradient(ellipse at 90% 93%, rgba(219,198,172,.22), transparent 35%),
    repeating-linear-gradient(0deg, rgba(145,111,79,.018) 0px, rgba(145,111,79,.018) 1px, transparent 1px, transparent 4px),
    linear-gradient(145deg,#fbf5ed,#f2e5d6 100%);
  box-shadow:inset 0 0 28px rgba(181,147,111,.09), inset 0 0 0 5px rgba(255,255,255,.16);
}
.paper-page::after { content:""; position:absolute; inset:10px; border:1px solid rgba(175,143,109,.16); border-radius:3px 9px 9px 3px; pointer-events:none; z-index:0; }
.paper-page::before { content:"✈"; position:absolute; z-index:2; right:17%; top:22px; font:20px var(--serif); color:#b79b7a; transform:rotate(-9deg); opacity:.8; }
.page-inner { height:100%; min-height:0; display:flex; flex-direction:column; align-items:center; text-align:center; }
.page-eyebrow { margin:7px 0 13px; letter-spacing:.23em; color:#8c745a; font:500 clamp(10px,2.6vw,13px) var(--serif); }
.page-title { margin:0; font:500 clamp(23px,6vw,31px) var(--serif); letter-spacing:.03em; }
.page-subtitle { font-size:clamp(10px,2.9vw,13px); color:var(--muted); margin:7px 0 0; line-height:1.7; }
.airmail-stamp { position:absolute; right:12px; top:12px; width:62px; height:62px; display:grid; place-items:center; border:1px dashed rgba(174,143,110,.6); border-radius:50%; color:#b99b78; font:10px var(--serif); transform:rotate(12deg); opacity:.65; }
.airmail-stamp::before { content:"✈"; position:absolute; font-size:20px; }
.page-number { position:absolute; bottom:15px; left:0; right:0; text-align:center; color:#806f5d; letter-spacing:.12em; font:11px var(--serif); z-index:3; }
.ornament { width:54px; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); margin:13px auto; position:relative; }
.ornament::after { content:"✦"; position:absolute; top:-8px; left:50%; transform:translateX(-50%); color:var(--gold); font-size:10px; background:var(--paper); padding:0 5px; }
.small-caps { font:500 10px var(--serif); letter-spacing:.18em; color:#947b60; }

/* 01 Cover */
.cover-page { padding:0; background:#e8d9c6; }
.cover-page::before { display:none; }
.cover-photo { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 43%; }
.cover-wash { position:absolute; inset:0; background:linear-gradient(180deg,rgba(229,213,191,.74) 0%,rgba(235,221,201,.20) 30%,rgba(237,223,203,.22) 62%,rgba(230,210,184,.86) 100%),linear-gradient(rgba(229,213,191,.20),rgba(229,213,191,.20)); }
.cover-frame { position:absolute; inset:13px; border:1px solid rgba(239,226,207,.82); border-radius:3px 9px 9px 3px; }
.cover-copy { position:absolute; top:6.4%; left:12px; right:12px; text-align:center; color:#4c4035; text-shadow:0 1px 8px rgba(242,229,210,.92); }
.cover-script { margin:0; font:italic 400 clamp(42px,9.5vw,58px)/1.04 'Cormorant Garamond', Georgia, serif; letter-spacing:0; }
.cover-tagline { margin:1px 0 0; font:500 12px var(--serif); letter-spacing:.08em; }
.cover-bottom { position:absolute; left:15px; right:15px; bottom:7.1%; text-align:center; color:#51463b; text-shadow:0 1px 7px rgba(242,229,210,.95); }
.cover-names { margin:0; font-size:clamp(21px,5vw,27px); letter-spacing:.19em; }
.cover-date { margin:8px 0 4px; font:500 13px var(--serif); letter-spacing:.09em; }
.cover-venue { margin:0; font-size:11px; letter-spacing:.08em; }
.cover-flight { font:19px var(--serif); color:#a98d69; margin:0 0 9px; }
.cover-page .page-number { color:#615346; bottom:14px; }

/* 02 Invitation */
.invitation-page { background:linear-gradient(rgba(248,240,229,.64),rgba(248,240,229,.72)),url('assets/couple-cover.jpg') center 43%/cover; }
.invitation-copy { margin: clamp(16px,5vh,42px) 0 0; font-size:clamp(13px,3.4vw,16px); line-height:2.05; letter-spacing:.02em; word-break:keep-all; }
.parent-lines { width:100%; margin-top:auto; padding-bottom:14px; display:grid; grid-template-columns:1fr 1fr; gap:12px; font-size:11px; line-height:1.8; }
.parent-lines strong { display:block; font-size:15px; font-weight:500; margin:2px 0; }
.parent-lines span { color:#897762; font-size:10px; }
.invitation-signoff { margin:17px 0 0; font-size:12px; line-height:1.8; }

/* 03 Save the date */
.date-card { width:100%; margin:22px 0 12px; padding:13px 8px 12px; border:1px solid #cdb69b; border-radius:10px; outline:1px solid rgba(184,152,117,.26); outline-offset:4px; background:rgba(255,251,245,.34); }
.date-main { font:500 clamp(27px,7vw,35px) var(--serif); letter-spacing:.02em; }
.date-time { margin-top:1px; font:500 14px var(--serif); letter-spacing:.12em; }
.dday { font:500 24px var(--serif); letter-spacing:.08em; color:#9a7d5c; margin:12px 0 5px; }
.calendar { width:100%; margin-top:13px; }
.calendar-month { margin-bottom:9px; font:500 17px var(--serif); }
.calendar-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px 0; font:12px var(--serif); }
.calendar-grid span { min-height:28px; display:grid; place-items:center; }
.calendar-grid .weekday { font:500 10px var(--serif); color:#9b846b; min-height:22px; }
.calendar-grid .event-day { width:27px; height:27px; min-height:27px; margin:auto; border-radius:50%; background:#a98a68; color:white; box-shadow:0 2px 4px rgba(88,65,44,.2); }
.calendar-note { margin:auto 0 10px; font-size:11px; line-height:1.7; color:#87745f; }

/* 04 Travel log */
.travel-page { padding-bottom:36px; }
.travel-intro { margin:5px 0 12px; font-size:11px; color:#907c67; }
.postcard-layout { position:relative; width:100%; flex:1; min-height:0; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1.06fr .92fr; gap:12px 9px; padding:3px 2px 5px; }
.stamp-photo { position:relative; margin:0; padding:6px; background:#fffdf8; box-shadow:0 4px 12px rgba(85,65,45,.17); border:1px solid #e8d9c7; transform:rotate(-4deg); min-height:0; }
.stamp-photo:nth-child(2) { transform:rotate(4deg); align-self:center; }
.stamp-photo:nth-child(3) { transform:rotate(2deg); grid-column:1/3; width:63%; justify-self:center; }
.stamp-photo img { width:100%; height:100%; display:block; object-fit:cover; }
.stamp-photo figcaption { position:absolute; bottom:7px; left:0; right:0; text-align:center; color:#fff; text-shadow:0 1px 3px #4a4034; font:italic 11px var(--serif); }
.travel-quote { font:italic 24px var(--serif); color:#a68a6a; margin:7px 0 2px; }
.more-button { flex:none; margin-top:9px; border:1px solid #c7ad8f; border-radius:30px; padding:8px 22px; background:rgba(255,255,255,.35); font-size:11px; letter-spacing:.08em; cursor:pointer; }

/* 05 Directions */
.direction-page { padding-left:clamp(14px,4vw,24px); padding-right:clamp(14px,4vw,24px); }
.venue-photo-wrap { width:100%; height:23%; min-height:100px; margin:14px 0 12px; padding:6px; background:#fffdf8; border:1px solid #e4d4c1; transform:rotate(-2deg); box-shadow:0 4px 11px rgba(84,64,45,.14); }
.venue-photo-wrap img { width:100%; height:100%; object-fit:cover; object-position:50% 45%; display:block; }
.venue-name { margin:0; font-size:17px; font-weight:500; }
.venue-address { margin:5px 0 10px; font-size:11px; line-height:1.7; color:#756656; }
.map-button { border:1px solid #cdb69b; border-radius:24px; background:rgba(255,255,255,.38); padding:8px 23px; color:#665443; font-size:11px; text-decoration:none; }
.directions-details { width:100%; text-align:left; margin-top:13px; padding-top:10px; border-top:1px solid rgba(170,140,107,.35); font-size:10px; line-height:1.8; }
.directions-details p { margin:3px 0; }
.contact-grid { display:grid; grid-template-columns:66px 1fr; gap:3px 7px; margin-top:8px; font-size:10px; line-height:1.8; }
.contact-grid strong { font-weight:500; color:#8a7358; }
.bank-info { margin-top:8px; padding-top:7px; border-top:1px dashed rgba(170,140,107,.4); }
.bank-info p { margin:2px 0; }

/* 06 RSVP */
.rsvp-page { padding:clamp(15px,3.5vw,24px) clamp(15px,4.3vw,25px) 35px; }
.rsvp-page .page-eyebrow { margin:2px 0 7px; }
.rsvp-title { margin:0; font-size:clamp(20px,5.2vw,25px); font-weight:500; }
.rsvp-lead { margin:4px 0 10px; color:#88745e; font-size:11px; }
.rsvp-form { width:100%; text-align:left; display:flex; flex-direction:column; gap:8px; min-height:0; }
.form-group { min-width:0; }
.form-label { display:flex; align-items:center; gap:5px; margin:0 0 4px; color:#6f5c49; font-size:10px; font-weight:600; }
.form-label .form-icon { width:15px; text-align:center; font-size:12px; }
.rsvp-input, .rsvp-select, .rsvp-textarea { display:block; width:100%; min-width:0; border:1px solid #d8c7b3; border-radius:10px; padding:8px 11px; background:rgba(255,255,255,.52); color:#584a3d; outline:none; font-size:11px; }
.rsvp-input:focus, .rsvp-select:focus, .rsvp-textarea:focus { border-color:#ad8c67; box-shadow:0 0 0 2px rgba(173,140,103,.12); }
.rsvp-input::placeholder, .rsvp-textarea::placeholder { color:#b2a18e; }
.choice-row { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:5px; }
.choice-row--three { grid-template-columns:repeat(3,minmax(0,1fr)); }
.choice-row--four { grid-template-columns:repeat(4,minmax(0,1fr)); }
.choice { position:relative; }
.choice input { position:absolute; opacity:0; width:1px; height:1px; }
.choice span { display:flex; justify-content:center; align-items:center; min-height:32px; padding:4px 5px; border:1px solid #d9c8b5; border-radius:9px; background:rgba(255,255,255,.42); color:#796855; font-size:10px; white-space:nowrap; cursor:pointer; }
.choice input:checked + span { border-color:#b99a76; color:#5f4c38; background:#ead9c4; box-shadow:inset 0 0 0 1px rgba(185,154,118,.15); }
.choice input:focus-visible + span { outline:2px solid #8b6c4c; outline-offset:2px; }
.rsvp-textarea { min-height:48px; max-height:65px; resize:vertical; }
.submit-rsvp { display:flex; width:84%; align-self:center; justify-content:center; align-items:center; gap:9px; margin-top:1px; padding:10px 12px; border:0; border-radius:24px; background:linear-gradient(100deg,#b89976,#a98965); color:#fffaf2; font-size:11px; letter-spacing:.04em; cursor:pointer; box-shadow:0 3px 8px rgba(104,76,48,.18); }
.submit-rsvp:disabled { opacity:.55; cursor:wait; }
.submit-status { min-height:15px; margin:0; color:#80694e; text-align:center; font-size:9px; line-height:1.5; }
.form-note { margin:0; color:#9b8874; text-align:center; font-size:9px; }

/* 07 Thank you */
.thankyou-page { padding:0; }
.thankyou-page::before { display:none; }
.thankyou-photo { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 48%; }
.thankyou-wash { position:absolute; inset:0; background:linear-gradient(180deg,rgba(249,242,232,.59),rgba(248,240,229,.73) 42%,rgba(248,239,226,.31) 100%); }
.thankyou-frame { position:absolute; inset:13px; border:1px solid rgba(255,255,255,.72); }
.thankyou-content { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; text-align:center; padding:19% 15px 12%; }
.thankyou-script { margin:0 0 29px; font:400 clamp(42px,10vw,56px)/1.1 'Cormorant Garamond', serif; color:#705740; text-shadow:0 1px 8px rgba(255,255,255,.9); }
.thankyou-message { margin:0; font-size:13px; line-height:2.1; color:#5f5143; text-shadow:0 1px 7px rgba(255,255,255,.85); }
.thankyou-sign { margin-top:19px; font-size:15px; letter-spacing:.16em; color:#594a3b; }
.final-stamp { margin-top:auto; border:1px solid rgba(160,126,88,.55); border-radius:50%; width:78px; height:78px; display:grid; place-items:center; color:#967858; font:11px var(--serif); line-height:1.35; transform:rotate(-12deg); background:rgba(255,250,242,.26); }
.final-stamp span { font-size:20px; }
.thankyou-page .page-number { color:#594b3e; }

.page-controls { width:min(92vw,460px); display:flex; align-items:center; justify-content:space-between; padding:0 3px; }
.nav-arrow { border:1px solid rgba(158,129,99,.48); width:35px; height:31px; border-radius:18px; background:rgba(255,251,245,.38); cursor:pointer; color:#79644e; font:26px/20px var(--serif); display:grid; place-items:center; }
.nav-arrow:disabled { opacity:.28; cursor:default; }
.page-progress { flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; font:11px var(--serif); color:#816e5a; letter-spacing:.12em; }
.progress-track { width:84px; height:2px; background:rgba(160,130,99,.2); overflow:hidden; }
.progress-track i { display:block; height:100%; width:14.285%; background:#a98a68; transition:width .3s ease; }
.swipe-hint { margin:0; color:#9a8875; text-align:center; font-size:9px; letter-spacing:.03em; }
.swipe-hint span { color:#b39878; }
.footer-note { color:#a18d77; font:9px var(--serif); letter-spacing:.2em; }

/* Gallery overlay */
.gallery-modal { position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center; padding:20px; }
.gallery-modal.is-open { display:flex; }
.gallery-modal__backdrop { position:absolute; inset:0; background:rgba(45,35,27,.58); backdrop-filter:blur(5px); }
.gallery-modal__panel { position:relative; width:min(94vw,650px); max-height:88dvh; overflow:auto; padding:28px 22px 24px; border:1px solid #d8c4aa; border-radius:12px; background:linear-gradient(145deg,#fbf6ef,#f0e3d4); box-shadow:0 20px 70px rgba(0,0,0,.25); text-align:center; }
.gallery-modal__panel .eyebrow { margin:0 0 5px; color:#957a5c; font:11px var(--serif); letter-spacing:.22em; }
.gallery-modal__panel h2 { margin:0; font:500 27px var(--serif); }
.modal-caption { margin:6px 0 17px; color:#8c7965; font-size:11px; }
.modal-close, .lightbox-close { position:absolute; top:10px; right:13px; border:0; background:none; color:#816a51; font-size:28px; cursor:pointer; z-index:3; }
.gallery-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
.gallery-thumb { border:6px solid #fffdf8; padding:0; background:#fff; box-shadow:0 3px 10px rgba(81,61,42,.13); cursor:zoom-in; aspect-ratio:3/4; overflow:hidden; }
.gallery-thumb img { display:block; width:100%; height:100%; object-fit:cover; }
.gallery-lightbox { position:fixed; inset:0; z-index:5; display:none; align-items:center; justify-content:center; background:rgba(28,22,17,.91); padding:45px 46px 55px; }
.gallery-lightbox.is-open { display:flex; }
.gallery-lightbox img { max-width:100%; max-height:100%; object-fit:contain; box-shadow:0 8px 36px rgba(0,0,0,.4); }
.gallery-lightbox button { position:absolute; border:0; background:rgba(255,255,255,.13); color:white; border-radius:50%; width:38px; height:38px; font-size:25px; cursor:pointer; }
.lightbox-close { top:15px; right:15px; background:none!important; }
.lightbox-prev { left:9px; top:50%; transform:translateY(-50%); }
.lightbox-next { right:9px; top:50%; transform:translateY(-50%); }
.lightbox-count { position:absolute; bottom:17px; color:#f2e8dc; font:12px var(--serif); letter-spacing:.15em; }
.hidden-frame { position:absolute; width:1px; height:1px; border:0; left:-9999px; }

@media (max-width:380px) {
  .invitation-app { padding-left:9px; padding-right:9px; }
  .book-stage { width:min(94vw, 460px, calc((100dvh - 160px) * .585)); max-height:calc(100dvh - 160px); }
  .paper-page { padding-left:14px; padding-right:14px; }
  .rsvp-form { gap:6px; }
  .choice span { font-size:9px; min-height:30px; }
  .venue-photo-wrap { height:20%; }
  .directions-details { margin-top:9px; }
}
@media (orientation:landscape) and (max-height:560px) {
  .invitation-app { padding-top:5px; padding-bottom:4px; }
  .topbar, .footer-note { display:none; }
  .viewer { gap:4px; }
  .book-stage { height:80dvh; width:calc(80dvh * .585); max-width:88vw; }
  .page-controls { width:min(75vw,420px); }
  .swipe-hint { display:none; }
}
@media (prefers-reduced-motion:reduce) {
  *, *::before, *::after { scroll-behavior:auto!important; animation-duration:.01ms!important; transition-duration:.01ms!important; }
}

.venue-photo-placeholder {
  width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:
    linear-gradient(145deg,rgba(255,255,255,.72),rgba(237,224,207,.72)),
    repeating-linear-gradient(135deg,rgba(165,132,97,.06) 0 1px,transparent 1px 8px);
  color:#92785b; border:1px solid rgba(171,141,107,.19);
}
.building-icon { font:48px/1 var(--serif); color:#ad8d68; }
.venue-placeholder-title { margin-top:7px; font:500 10px var(--serif); letter-spacing:.2em; }
.venue-placeholder-text { margin-top:6px; text-align:center; font-size:10px; line-height:1.7; color:#9a8874; }


/* Refined StPageFlip finish */
.stf__parent { margin:0 auto; }
.stf__block { border-radius:5px 12px 12px 5px; }
.stf__item { overflow:hidden; }
.book .page .paper-page { width:100%; height:100%; border-radius:5px 12px 12px 5px; }
.book .page .paper-page::after { pointer-events:none; }
.book input, .book select, .book textarea, .book label, .book button, .book a { touch-action:manipulation; }
.book .rsvp-page { -webkit-user-select:auto; user-select:auto; }
@media (max-width:380px) {
  .book-stage { width:min(94vw, calc((100dvh - 160px) * .585)); }

/* Offline-safe leaf-curl fallback. It is visible immediately while the optional
   full page-curl engine downloads, and remains fully navigable without a CDN. */
.book.is-fallback {
  perspective: 1800px;
  transform-style: preserve-3d;
  overflow: visible;
}
.book.is-fallback .page {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: none;
  overflow: visible;
  border: 0;
  border-radius: 5px 12px 12px 5px;
  background: transparent;
  transform-style: preserve-3d;
  transform: translateZ(0);
  backface-visibility: visible;
}
.book.is-fallback .page.is-current,
.book.is-fallback .page.is-under,
.book.is-fallback .page.is-turning-next,
.book.is-fallback .page.is-turning-prev { display: block; }
.book.is-fallback .page.is-under { z-index: 1; }
.book.is-fallback .page.is-current { z-index: 2; }
.book.is-fallback .page.is-turning-next,
.book.is-fallback .page.is-turning-prev { z-index: 3; }
.book.is-fallback .page-content {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  border-radius: 5px 12px 12px 5px;
  backface-visibility: hidden;
  transform: translateZ(1px);
}

  position: absolute;

  transform-origin: left center;
  animation: invitation-leaf-next 1480ms cubic-bezier(.38,.02,.16,1) forwards;
}
.book.is-fallback .page.is-turning-prev {

}

.book.is-fallback .page.is-turning-prev::after {

const $ = (selector, root = document) => root.querySelector(selector);
const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
const escapeHTML = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[char]));

function dateParts() {
  const date = new Date(INVITATION.dateTime);
  const dateTokens = new Intl.DateTimeFormat('en-US', {
    timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit'
  }).formatToParts(date);
  const token = (type) => dateTokens.find((part) => part.type === type)?.value;
  const year = Number(token('year'));
  const month = Number(token('month')) - 1;
  const day = Number(token('day'));
  const timeLabel = new Intl.DateTimeFormat('ko-KR', {
    timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
  }).format(date);
  const weekdayLabel = new Intl.DateTimeFormat('ko-KR', {
    timeZone: 'Asia/Seoul', weekday: 'long'
  }).format(date);
  const weekdayEn = new Intl.DateTimeFormat('en-US', {
    timeZone: 'Asia/Seoul', weekday: 'short'
  }).format(date).toUpperCase();
  return {
    date, year, month, day, timeLabel, weekdayLabel, weekdayEn,
    dateLabel: `${year}. ${String(month + 1).padStart(2, '0')}. ${String(day).padStart(2, '0')}`
  };
}

function ddayLabel() {
  const target = dateParts();
  const todayTokens = new Intl.DateTimeFormat('en-US', {
    timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit'
  }).formatToParts(new Date());
  const todayValue = (type) => Number(todayTokens.find((part) => part.type === type)?.value);
  const todaySerial = Date.UTC(todayValue('year'), todayValue('month') - 1, todayValue('day'));
  const targetSerial = Date.UTC(target.year, target.month, target.day);
  const diff = Math.round((targetSerial - todaySerial) / 86400000);
  return diff > 0 ? `D - ${diff}` : diff < 0 ? `D + ${Math.abs(diff)}` : 'D-DAY';

function renderCalendar() {

  for (let n = 1; n <= lastDate; n++) {
    const value = n === day
      ? `<b class="event-day" aria-label="예식일 ${n}일"><svg viewBox="0 0 48 44" aria-hidden="true"><path d="M24 41 C20 37 7 27 7 17 C7 9 16 5 24 14 C32 5 41 9 41 17 C41 27 28 37 24 41Z"/></svg><span>${n}</span></b>`
      : `${n}`;
    cells += `<span class="calendar-day">${value}</span>`;

  return `<div class="calendar-shell calendar-shell--extended">
    <svg class="calendar-floral-frame" viewBox="0 0 360 290" preserveAspectRatio="none" aria-hidden="true">
      <rect x="8" y="8" width="344" height="274" rx="15" fill="none" stroke="#bd9d78" stroke-opacity=".48" stroke-width="1"/>

      <g fill="none" stroke="#ad8e6b" stroke-width="1.05" stroke-linecap="round" stroke-linejoin="round" opacity=".82">
        <path d="M18 67 C28 48 39 34 58 24 M25 51 C17 44 17 35 22 30 C31 33 34 40 31 48 M36 38 C35 27 41 20 50 19 C54 27 50 36 40 41 M48 29 C55 20 65 19 72 25 C69 34 60 38 49 35"/>
        <path d="M342 67 C332 48 321 34 302 24 M335 51 C343 44 343 35 338 30 C329 33 326 40 329 48 M324 38 C325 27 319 20 310 19 C306 27 310 36 320 41 M312 29 C305 20 295 19 288 25 C291 34 300 38 311 35"/>
        <path d="M18 254 C27 263 40 270 57 272 M24 264 C17 260 15 253 19 247 C27 249 31 255 29 263 M38 268 C35 277 40 282 48 284 C53 278 50 271 42 266 M49 271 C57 279 66 280 73 275 C69 267 61 265 51 267"/>
        <path d="M342 254 C333 263 320 270 303 272 M336 264 C343 260 345 253 341 247 C333 249 329 255 331 263 M322 268 C325 277 320 282 312 284 C307 278 310 271 318 266 M311 271 C303 279 294 280 287 275 C291 267 299 265 309 267"/>
        <path d="M90 276 C101 268 111 268 122 276 M238 276 C249 268 259 268 270 276" opacity=".4"/>
      </g>
      <g fill="#b59672" opacity=".78">
        <circle cx="22" cy="30" r="2.7"/><circle cx="338" cy="30" r="2.7"/>

  return `<div class="family-columns family-columns--${kind}">
    ${column('신랑 측', leftItems)}

function updateControls() {
  if (pageFlip && pageFlip.isReady()) currentPage = pageFlip.getCurrentPageIndex();
  const busy = (pageFlip && pageFlip.isReady()) ? pageFlip.isAnimating() : (turning || $('#book').classList.contains('is-engine-loading'));
  $('#page-counter').textContent = `${currentPage + 1} / ${pages.length}`;
  $('#progress-fill').style.width = `${((currentPage + 1) / pages.length) * 100}%`;
  $('#prev-page').disabled = currentPage === 0 || busy;
  $('#next-page').disabled = currentPage === pages.length - 1 || busy;
  $$('.page-jump-button').forEach((button, index) => {
    const active = index === currentPage;
    button.classList.toggle('is-active', active);
    button.toggleAttribute('aria-current', active);
    if (active) button.setAttribute('aria-current', 'page');
    else button.removeAttribute('aria-current');
    button.disabled = busy;
  });
}

function setFallbackPage(index) {
  const root = $('#book');
  const leaves = $$('.page', root);
  leaves.forEach((leaf, i) => {
    leaf.classList.remove('is-current', 'is-under', 'is-turning-next', 'is-turning-prev');
    leaf.setAttribute('aria-hidden', i === index ? 'false' : 'true');
  });
  if (leaves[index]) leaves[index].classList.add('is-current');
}

function finishFallbackTurn(nextIndex) {
  currentPage = nextIndex;
  turning = false;
  setFallbackPage(currentPage);
  updateControls();
}

function turnFallbackPage(direction) {
  const root = $('#book');
  if (turning || !root.classList.contains('is-fallback')) return;
  const nextIndex = direction === 'next' ? currentPage + 1 : currentPage - 1;
  if (nextIndex < 0 || nextIndex >= pages.length) return;
  fallbackHasBeenUsed = true;

  const leaves = $$('.page', root);
  const currentLeaf = leaves[currentPage];
  const underLeaf = leaves[nextIndex];
  if (!currentLeaf || !underLeaf) return;

  turning = true;
  underLeaf.classList.add('is-under');
  underLeaf.setAttribute('aria-hidden', 'false');
  currentLeaf.classList.add(direction === 'next' ? 'is-turning-next' : 'is-turning-prev');
  updateControls();

  let finished = false;
  const finish = () => {
    if (finished) return;
    finished = true;
    finishFallbackTurn(nextIndex);
  };
  currentLeaf.addEventListener('transitionend', (event) => {
    if (event.target === currentLeaf && event.propertyName === 'transform') finish();
  }, { once: true });
  // Safety net in case a browser skips transitionend (for example, background tabs).
  window.setTimeout(finish, window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 80 : 1080);
}

function attachFallbackGestures() {
  const root = $('#book');
  let start = null;
  root.addEventListener('pointerdown', (event) => {
    if (!root.classList.contains('is-fallback') || !event.isPrimary) return;
    if (event.target.closest('button, a, input, select, textarea, label')) return;
    start = { x: event.clientX, y: event.clientY, pointerId: event.pointerId };
  });
  root.addEventListener('pointerup', (event) => {
    if (!start || event.pointerId !== start.pointerId) return;
    const dx = event.clientX - start.x;
    const dy = event.clientY - start.y;
    start = null;
    if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.15) {
      turnPage(dx < 0 ? 'next' : 'prev');
    }
  });
  root.addEventListener('pointercancel', () => { start = null; });
}

function initializeBook() {
  const root = $('#book');
  root.innerHTML = pages.map((render, index) =>
    `<div class="page" data-density="soft" data-page-index="${index}">
      <div class="page-content">${render()}</div>
      <div class="page-backface" aria-hidden="true"></div>
    </div>`
  ).join('');
  root.classList.add('is-fallback');
  currentPage = Math.max(0, Math.min(pages.length - 1, Number(new URLSearchParams(location.search).get('page') || 1) - 1));
  setFallbackPage(currentPage);
  attachFallbackGestures();
  updateControls();
}

function jumpToPage(index) {
  if (!Number.isInteger(index) || index < 0 || index >= pages.length || turning) return;
  if (pageFlip && pageFlip.isReady()) {
    // This standalone preview uses the local fallback renderer; retain a safe fallback if an engine is added later.
    currentPage = index;
    updateControls();
    return;
  }
  currentPage = index;
  setFallbackPage(currentPage);
  updateControls();
}

function turnPage(direction) {
  if (pageFlip && pageFlip.isReady()) {
    if (pageFlip.isAnimating()) return;
    if (direction === 'next' && pageFlip.canTurn('next')) pageFlip.flipNext();
    if (direction === 'prev' && pageFlip.canTurn('prev')) pageFlip.flipPrev();
    updateControls();
    return;
  }
  turnFallbackPage(direction);
}

function openGallery() {
  const grid = $('#gallery-grid');
  const photoCards = GALLERY_PHOTOS.map((photo, index) => `<button class="gallery-thumb${photo.placeholder ? ' gallery-thumb--preview' : ''}" type="button" data-photo-index="${index}" aria-label="${escapeHTML(photo.alt)}"><img src="${escapeHTML(photo.src)}" alt="${escapeHTML(photo.alt)}">${photo.placeholder ? '<span class="gallery-preview-badge">PREVIEW</span>' : ''}</button>`).join('');
  const emptyCards = GALLERY_EMPTY_SLOTS.map((slot) => `<div class="gallery-empty-slot" aria-label="${slot.label} 사진 추가 자리"><span class="gallery-empty-slot__plus">＋</span><strong>${slot.label}</strong><small>사진 추가 예정</small></div>`).join('');
  grid.innerHTML = photoCards + emptyCards;
  $('#gallery-modal').classList.add('is-open');
  $('#gallery-modal').setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}

function closeGallery() {
  $('#gallery-modal').classList.remove('is-open');
  $('#gallery-modal').setAttribute('aria-hidden', 'true');
  closeLightbox();
  document.body.style.overflow = '';
}

function showLightbox(index) {
  if (!GALLERY_PHOTOS.length) return;
  lightboxIndex = (index + GALLERY_PHOTOS.length) % GALLERY_PHOTOS.length;
  const photo = GALLERY_PHOTOS[lightboxIndex];
  $('#lightbox-image').src = photo.src;
  $('#lightbox-image').alt = photo.alt;
  $('#lightbox-count').textContent = `${lightboxIndex + 1} / ${GALLERY_PHOTOS.length}`;
  $('#gallery-lightbox').classList.add('is-open');
  $('#gallery-lightbox').setAttribute('aria-hidden', 'false');
}

function closeLightbox() {
  $('#gallery-lightbox').classList.remove('is-open');
  $('#gallery-lightbox').setAttribute('aria-hidden', 'true');
}

$('#prev-page').addEventListener('click', () => turnPage('prev'));
$('#next-page').addEventListener('click', () => turnPage('next'));
$('#page-jump-nav').addEventListener('click', (event) => {
  const button = event.target.closest('[data-jump-page]');
  if (button) jumpToPage(Number(button.dataset.jumpPage));
});
$('#book').addEventListener('click', (event) => {
  const action = event.target.closest('[data-action]')?.dataset.action;
  if (action === 'open-gallery') openGallery();
});
$('#gallery-modal').addEventListener('click', (event) => {
  if (event.target.closest('[data-close-gallery]')) closeGallery();
  const thumb = event.target.closest('[data-photo-index]');
  if (thumb) showLightbox(Number(thumb.dataset.photoIndex));
});
$('#gallery-lightbox').addEventListener('click', (event) => {
  if (event.target.closest('.lightbox-close')) closeLightbox();
  if (event.target.closest('.lightbox-prev')) showLightbox(lightboxIndex - 1);
  if (event.target.closest('.lightbox-next')) showLightbox(lightboxIndex + 1);
});

window.addEventListener('keydown', (event) => {
  if ($('#gallery-modal').classList.contains('is-open')) {
    if (event.key === 'Escape') closeGallery();
    if ($('#gallery-lightbox').classList.contains('is-open')) {
      if (event.key === 'ArrowLeft') showLightbox(lightboxIndex - 1);
      if (event.key === 'ArrowRight') showLightbox(lightboxIndex + 1);
    }
    return;
  }
  if (event.key === 'ArrowRight') turnPage('next');
  if (event.key === 'ArrowLeft') turnPage('prev');
});

// Static draft preview: render the requested page without external dependencies.
initializeBook();

// Start the 1.5-second swipe hint after the invitation has had a chance to render.
const swipeIntroHint = document.getElementById('swipe-intro-hint');
if (swipeIntroHint) {
  const removeSwipeHint = () => swipeIntroHint.remove();
  const swipeHintImage = swipeIntroHint.querySelector('img');
  swipeHintImage.addEventListener('animationend', removeSwipeHint, { once: true });
  requestAnimationFrame(() => requestAnimationFrame(() => {
    swipeIntroHint.classList.add('is-visible');
  }));
  window.setTimeout(removeSwipeHint, 1800);
}
// D-day is calculated from the current date in Korea Standard Time and refreshes while open.
const refreshWeddingCountdown = () => {
  const node = document.getElementById('live-dday');
  if (node) node.textContent = ddayLabel();
};
refreshWeddingCountdown();
window.setInterval(refreshWeddingCountdown, 60_000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) refreshWeddingCountdown();
});

</script>
